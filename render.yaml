# Render Blueprint — API only (server folder)
services:
  - type: web
    name: uscl-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLIENT_URL
        value: https://uscl-website-opal.vercel.app
      - key: CLIENT_URLS
        value: https://www.usclt20.com,https://usclt20.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: USCL Admin
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: REGISTRATION_FEE_INR
        value: "999"
